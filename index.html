<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HS2 C23: Asset Delivery Workflow</title>
<style>
  :root{
    --bg-0:#0a0e1a; --bg-1:#111827; --line:#232c44; --txt:#e8edf7; --muted:#94a3b8; --accent:#38bdf8;
    --c1:#22c55e; --c2:#38bdf8; --c3:#a78bfa; --c4:#f59e0b; --c5:#10b981;
    --r-dl:#60a5fa; --r-mod:#34d399; --r-bc:#f472b6; --r-ekfb:#fbbf24;
    --r-bm:#a78bfa; --r-gis:#22d3ee; --r-dc:#fb7185;
    --subA:#38bdf8; --subB:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 15% -10%,#16203a 0%,transparent 55%),
               radial-gradient(1000px 700px at 100% 0%,#141a30 0%,transparent 50%),var(--bg-0);
    color:var(--txt);width:100%;min-height:100vh;overflow-x:hidden;position:relative;}

  .cursor-glow{position:fixed;top:0;left:0;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--glow,#38bdf8) 22%,transparent) 0%,
        color-mix(in srgb,var(--glow,#38bdf8) 9%,transparent) 35%,transparent 70%);
    pointer-events:none;transform:translate(-50%,-50%);z-index:0;transition:opacity .3s ease,background .5s ease;will-change:transform;filter:blur(4px);}

  .wrap{position:relative;z-index:1;width:100vw;max-width:100%;margin:0;padding:32px clamp(20px,3vw,48px) 80px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;
    margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .topbar .brand-right img{height:58px;width:auto;display:block;background:#fff;padding:7px 12px;border-radius:8px;}
  .ekfb{display:flex;align-items:center;gap:12px;background:#fff;padding:9px 16px;border-radius:8px;}
  .ekfb .bars{display:flex;flex-direction:column;gap:4px;}
  .ekfb .bars i{display:block;width:34px;height:8px;border-radius:1px;}
  .ekfb .bars i:nth-child(1){background:#e30613;} .ekfb .bars i:nth-child(2){background:#0a7d8c;}
  .ekfb .bars i:nth-child(3){background:#f6c000;} .ekfb .bars i:nth-child(4){background:#26a63a;}
  .ekfb .txt{font-weight:900;font-size:34px;letter-spacing:-1px;color:#111;line-height:1;}
  /* TYPSA · ARUP · TAJV wordmark */
  .tajv{background:#fff;padding:10px 16px 9px;border-radius:8px;display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .tajv .r1{display:flex;align-items:center;}
  .tajv .r1 .typsa{background:#e2231a;color:#fff;font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:18px;padding:3px 6px;letter-spacing:.2px;}
  .tajv .r1 .arup{color:#111;font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:18px;padding:0 0 0 5px;letter-spacing:.2px;}
  .tajv .r2{color:#111;font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:30px;letter-spacing:1px;margin-top:3px;}

  header{text-align:center;margin-bottom:22px;}
  h1{font-size:clamp(28px,4vw,46px);font-weight:700;letter-spacing:-.5px;
    background:linear-gradient(90deg,#e8edf7,#8ab4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  header p{color:var(--muted);margin-top:14px;font-size:15.5px;}


  @media(max-width:640px){.topbar{justify-content:center;}.ekfb .txt{font-size:26px;}.ekfb .bars i{width:26px;height:6px;}
    .tajv .r1 .typsa,.tajv .r1 .arup{font-size:16px;}.tajv .r2{font-size:22px;}}

  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 auto 40px;max-width:1100px;}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:100px;font-size:13px;font-weight:600;
    background:color-mix(in srgb,var(--rc) 14%,transparent);border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);color:var(--txt);}
  .chip .swatch{width:10px;height:10px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc);}

  .bar{position:relative;display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 46px;padding:0 6px;}
  .bar::before{content:"";position:absolute;top:31px;left:6%;right:6%;height:4px;background:var(--line);border-radius:100px;}
  .bar::after{content:"";position:absolute;top:31px;left:6%;height:4px;width:var(--fill,0%);
    background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));
    border-radius:100px;transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px rgba(56,189,248,.5);}

  .stage{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;padding:0 4px;}
  .dot{width:64px;height:64px;border-radius:50%;background:var(--bg-1);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--muted);
    transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease,background .3s ease;}
  .stage:hover .dot{transform:translateY(-5px) scale(1.06);}
  .stage.active .dot{background:linear-gradient(135deg,var(--sc),transparent);border-color:var(--sc);color:#fff;
    box-shadow:0 0 0 6px color-mix(in srgb,var(--sc) 18%,transparent),0 12px 30px color-mix(in srgb,var(--sc) 35%,transparent);transform:translateY(-5px) scale(1.08);}
  .stage.done .dot{border-color:var(--sc);color:var(--sc);}
  .label{margin-top:14px;font-size:13.5px;font-weight:600;text-align:center;max-width:130px;line-height:1.35;color:var(--muted);transition:color .3s ease;}
  .stage.active .label{color:var(--txt);}
  .step-no{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px;}
  .sublabel{display:flex;gap:5px;justify-content:center;margin-top:6px;}
  .sublabel span{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.3px;
    background:color-mix(in srgb,var(--pc) 20%,transparent);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);}

  .panel{position:relative;background:linear-gradient(180deg,rgba(21,28,46,.9),rgba(15,20,34,.9));
    border:1px solid var(--line);border-radius:20px;padding:38px 40px;overflow:hidden;min-height:220px;backdrop-filter:blur(6px);}
  .panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sc,var(--accent));transition:background .4s ease;}
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .badge{width:52px;height:52px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc) 40%,#000));box-shadow:0 8px 22px color-mix(in srgb,var(--sc) 35%,transparent);}
  .panel h2{font-size:23px;font-weight:700;}
  .panel .sub{color:var(--sc);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
  .panel p.desc{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:18px;max-width:100%;}
  .panel p.desc b{color:var(--txt);}

  .owners{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .owners .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;
    background:color-mix(in srgb,var(--rc) 16%,transparent);color:#fff;border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);}
  .owners .tag .swatch{width:8px;height:8px;border-radius:50%;background:var(--rc);}

  .sub-steps{list-style:none;display:grid;grid-template-columns:1fr;gap:11px;align-content:start;}
  @media(min-width:1100px){.sub-steps{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,1),auto);}}
  .sub-steps li{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    font-size:14.5px;color:var(--txt);display:flex;align-items:flex-start;gap:13px;line-height:1.55;transition:transform .2s ease,border-color .2s ease;}
  .sub-steps li:hover{transform:translateX(4px);border-color:var(--sc);}
  .sub-steps li .num{flex:none;width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--sc) 22%,transparent);
    color:var(--sc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .sub-steps li .body{flex:1;}
  .role-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .role-tags .rt{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:color-mix(in srgb,var(--rc) 16%,transparent);color:#fff;border:1px solid color-mix(in srgb,var(--rc) 40%,transparent);display:inline-flex;align-items:center;gap:5px;}
  .role-tags .rt .swatch{width:7px;height:7px;border-radius:50%;background:var(--rc);}
  em.hi{color:var(--sc);font-style:normal;font-weight:600;}

  .attrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .attrs .at{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc);border:1px solid color-mix(in srgb,var(--sc) 40%,transparent);}

  .gate{margin-top:16px;padding:12px 16px;border-radius:12px;font-size:13.5px;
    background:color-mix(in srgb,var(--sc) 10%,transparent);border:1px dashed color-mix(in srgb,var(--sc) 45%,transparent);color:var(--txt);}
  .gate b{color:var(--sc);}
  .placeholder{color:var(--muted);font-size:14px;font-style:italic;border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;}

  .common{margin-bottom:24px;}
  .common-title{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:8px;}
  .common-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .subs{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:1080px){.subs{grid-template-columns:1fr 1fr;}}
  .sub-card{--sc:var(--sca);position:relative;border:1px solid color-mix(in srgb,var(--sca) 45%,var(--line));border-radius:16px;
    padding:22px 22px 24px;background:linear-gradient(180deg,color-mix(in srgb,var(--sca) 7%,transparent),rgba(255,255,255,.015));}
  .sub-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:16px 0 0 16px;background:var(--sca);}
  .sc-head{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
  .sc-badge{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;color:#04121f;background:linear-gradient(135deg,var(--sca),color-mix(in srgb,var(--sca) 55%,#fff));box-shadow:0 6px 18px color-mix(in srgb,var(--sca) 40%,transparent);}
  .sc-name{font-size:18px;font-weight:800;line-height:1.1;}
  .sc-only{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--sca);margin-top:3px;}
  .comprises{margin:6px 0 14px;}
  .comprises .ctitle{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .comprises .crow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);margin-bottom:7px;font-size:13.5px;}
  .comprises .crow .doc{font-weight:700;}
  .comprises .crow .role-tags{margin-top:0;}
  .checks-badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;}
  .checks-badges .cb{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;
    background:color-mix(in srgb,var(--sca) 18%,transparent);color:var(--sca);border:1px solid color-mix(in srgb,var(--sca) 42%,transparent);}
  .sc-steps{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:4px;}
  .sc-steps li{display:flex;gap:11px;align-items:flex-start;font-size:13.8px;line-height:1.5;
    background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .sc-steps li .n{flex:none;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--sca) 22%,transparent);
    color:var(--sca);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .sc-steps li em.hi{color:var(--sca);font-style:normal;font-weight:600;}
  .sc-steps li.xref{background:color-mix(in srgb,var(--xc) 8%,transparent);}
  .sc-steps li.xref .n{background:color-mix(in srgb,var(--xc) 24%,transparent);color:var(--xc);}
  .sc-steps li.xref em.hi{color:var(--xc);}
  .xtag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.4px;
    padding:2px 8px;border-radius:6px;margin-bottom:6px;text-transform:uppercase;
    background:color-mix(in srgb,var(--xc) 18%,transparent);color:var(--xc);border:1px solid color-mix(in srgb,var(--xc) 42%,transparent);}
  .sub-note{margin-top:14px;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);
    border:1px dashed var(--line);border-radius:10px;padding:10px 12px;}
  .sub-note b{color:var(--sca);}

  .anim{animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .nav{display:flex;justify-content:space-between;margin-top:26px;gap:12px;}
  .nav button{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);color:var(--txt);
    padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s ease,transform .2s ease;}
  .nav button:hover:not(:disabled){background:rgba(56,189,248,.18);transform:translateY(-2px);}
  .nav button:disabled{opacity:.35;cursor:not-allowed;}

  .foot{margin-top:48px;padding-top:26px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center;}
  .foot .arup{height:34px;width:auto;display:block;border-radius:6px;}
  .foot .fcaption{color:var(--muted);font-size:12.5px;}

  @media(max-width:720px){.label{font-size:11px;max-width:70px;}.dot{width:48px;height:48px;font-size:18px;}
    .bar::before,.bar::after{top:23px;}.panel{padding:26px 22px;}}
</style>
</head>

<script>
const roles = {
  DL:{name:"Discipline Leads",var:"--r-dl"}, MOD:{name:"Modellers",var:"--r-mod"},
  BC:{name:"BIM Coordinators",var:"--r-bc"}, EKFB:{name:"EKFB",var:"--r-ekfb"},
  BM:{name:"BIM Manager",var:"--r-bm"}, GIS:{name:"GIS Team",var:"--r-gis"}, DC:{name:"Document Controller",var:"--r-dc"}
};

const STAGE1 = {
  icon:"1", color:"#22c55e", title:"Greenlines Ongoing", tag:"Stage 01",
  desc:"Discipline Leads work through the redlines for each asset, gather the comments to be addressed and present them to EKFB in the GLAM meeting.",
  owners:["DL","MOD","EKFB","BM"],
  steps:[
    {t:"Discipline Leads receive the list of assets to work through.", r:["DL"]},
    {t:"Go through <em class='hi'>BIM XTra</em> and the <em class='hi'>Transportal</em> link to gather the redline drawings.", r:["DL"]},
    {t:"Extract the comments that need to be addressed from the redlines.", r:["DL"]},
    {t:"Present the comments to EKFB in the <em class='hi'>GLAM meeting</em>, where Modellers also attend.", r:["DL","MOD","EKFB"]},
    {t:"On approval, forward an email to the Modeller to start the <em class='hi'>DM3 (3D Solid Model)</em> and share the relevant drawings.", r:["DL"]},
    {t:"BIM Manager begins preparing the <em class='hi'>IMDATs</em>, taking data from the MPDT into the IMDAT.", r:["BM"]}
  ],
  gate:"Once the greenlines are approved in the GLAM meeting → proceed to <b>Accepted Greenlines</b>."
};

const S2 = {
  icon:"2", color:"#38bdf8", title:"Accepted Greenlines", tag:"Stage 02",
  desc:"The Modeller builds/updates the 3D Solid Model against the accepted greenlines, aligns it to the MPDT, exports the IFC and runs it through IFC review with the BIM Coordinator.",
  owners:["MOD","BC","EKFB"],
  steps:[
    {t:"Modeller updates the model against the <em class='hi'>accepted greenlines / markups</em> to prepare it for the Model Review.", r:["MOD"]},
    {t:"If there is a change needed in the <em class='hi'>MPDT</em> (Level 3 assets or HS2 Class changes), raise the issue via email to the respective BIM Coordinator of the asset.", r:["MOD"]},
    {t:"The respective BIM Coordinator for the asset raises the <em class='hi'>change request to EKFB</em>.", r:["BC","EKFB"]},
    {t:"Once the change request updates on the <em class='hi'>MPDT</em>, the Modeller updates the 3D Solid model so the <em class='hi'>Solid count exactly matches the MPDT data</em>.", r:["MOD"]},
    {t:"Modeller exports the <em class='hi'>IFC</em> and uploads it to the <em class='hi'>PW docset</em>.", r:["MOD"]},
    {t:"Once the model is ready, Modeller shares an email for IFC Review, with the subject line containing <em class='hi'>“IFC Review”</em>.", r:["MOD"]},
    {t:"BIM Coordinator reviews the IFC, mainly checking: the <em class='hi'>layer name</em>; the <em class='hi'>number of solids matches the MPDT</em>; <em class='hi'>UAID_3</em> are correctly assigned with no solid having two same UAID_3; <em class='hi'>Mtrl</em> matches the IMDAT and MPDT exactly (upper/lower case identical); and the <em class='hi'>HS2_Class</em> is correct. They also ensure every solid is tagged with all 7 attributes.<span class='attrs'><span class='at'>UAID_1</span><span class='at'>UAID_2</span><span class='at'>UAID_3</span><span class='at'>HS2_Class</span><span class='at'>Mtrl</span><span class='at'>Asset_Name3</span><span class='at'>UniClassID</span></span> If there are issues, comments go back to the Modeller, who resolves them and re-submits for review.", r:["BC","MOD"]},
    {t:"BIM Coordinator re-reviews and, if all looks good, replies on the email loop that the model is ready for the Model Review Call.", r:["BC"]}
  ],
  gate:"When the BIM Coordinator confirms the IFC is good → proceed to <b>Model Review Call</b>."
};

const S3 = {
  icon:"3", color:"#a78bfa", title:"Model Review Call", tag:"Stage 03",
  desc:"The BIM Manager presents the model to EKFB in the weekly review call. Any comments are resolved and signed off through the email loop.",
  owners:["BM","EKFB","MOD"],
  steps:[
    {t:"BIM Manager presents the model to EKFB <em class='hi'>every Wednesday</em> in the Model Review Call.", r:["BM","EKFB"]},
    {t:"If EKFB raises any comments, the Modeller resolves them and gets sign-off via the email loop.", r:["MOD","EKFB","BC","BM"]}
  ],
  gate:"If EKFB approves the model → proceed to <b>BIM Deliverables</b>."
};

const OLD_S4 = {
  icon:"4", color:"#f59e0b", title:"BIM Deliverables", tag:"Stage 04",
  desc:"With the green light from EKFB, Modellers finish the rest of the drawings and files in the docset and incorporate every PDF comment. The BIM Coordinator then runs the 5 delivery checks before the whole docset is advanced and shared with EKFB.",
  owners:["MOD","DL","GIS","BC","BM","DC","EKFB"],
  steps:[
    {t:"Modellers complete the rest of the drawings and files in the asset's docset and incorporate all comments given in the PDF.", r:["MOD"]},
    {t:"BIM Coordinator requests the <em class='hi'>GIS team to populate the GIS fields of the IMDAT</em>.", r:["BC","GIS"]},
    {t:"Modellers email their respective BIM Coordinator stating <em class='hi'>“the asset is ready for internal BIM submission”</em>.", r:["MOD"]},
    {t:"<em class='hi'>Check 1 — Creating Federated Model.</em>", r:["BC"]},
    {t:"<em class='hi'>Check 2 — Creating Clash Detection report.</em>", r:["BC"]},
    {t:"<em class='hi'>Check 3 — MDQCR (Model Delivery Quality Check).</em> BIM Coordinator generally informs the BIM Manager while doing the MDQCR.", r:["BC","BM"]},
    {t:"<em class='hi'>Check 4 — BIM Coordinator checks the IMDAT</em> and asks Modellers and Discipline Leads to fill it, ensuring the geometric data is populated: NetVolume, Lngthm, Hgthm, Depth and Reference Number.", r:["BC","MOD","DL"]},
    {t:"<em class='hi'>Check 5 — Export JSON.</em> After confirming every IMDAT field is populated with no blank fields, the BIM Coordinator exports the JSON file.", r:["BC"]},
    {t:"Once all checks pass, on the final MDQCR email the BIM Coordinator replies to the BIM Manager that everything looks fine, and asks Modellers to advance files on ProjectWise.", r:["BC","BM"]},
    {t:"Modellers, BIM Coordinator, BIM Manager & Document Controller each advance their respective files, and finally the docset is advanced and shared with EKFB.", r:["MOD","BC","BM","DC"]}
  ],
  gate:"When the full docset is advanced and shared with EKFB → EKFB reviews it (<b>Approved</b> stage)."
};

const OLD_S5 = {
  icon:"5", color:"#10b981", title:"Approved", tag:"Stage 05",
  desc:"EKFB reviews the shared docset. If it's all good the asset is approved; if they raise comments, Modellers resolve them and re-advance the files until EKFB issues the final approval email.",
  owners:["EKFB","MOD"],
  steps:[
    {t:"EKFB reviews the advanced docset.", r:["EKFB"]},
    {t:"If EKFB raises comments, Modellers resolve them and advance the files again, and the loop repeats until sign-off.", r:["MOD","EKFB"]},
    {t:"EKFB shares the <em class='hi'>final approval email</em> → the asset is Approved. ✅", r:["EKFB"]}
  ],
  gate:"Final approval email from EKFB completes the workflow for the asset."
};

const OLD = [STAGE1, S2, S3, OLD_S4, OLD_S5];
let stages = OLD;

const legend=document.getElementById('legend');
Object.values(roles).forEach(r=>{const c=document.createElement('span');c.className='chip';
  c.style.setProperty('--rc',`var(${r.var})`);c.innerHTML=`<span class="swatch"></span>${r.name}`;legend.appendChild(c);});

let current=0;
const bar=document.getElementById('bar'),panel=document.getElementById('panel');
const prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');

function buildBar(){
  bar.innerHTML='';
  stages.forEach((s,i)=>{
    const btn=document.createElement('button');btn.className='stage';btn.style.setProperty('--sc',s.color);
    const subl = s.sublabel ? `<span class="sublabel">${s.sublabel.map(x=>`<span style="--pc:${x.pc}">${x.t}</span>`).join('')}</span>` : '';
    btn.innerHTML=`<span class="dot">${s.icon}</span><span class="label">${s.title}</span><span class="step-no">${s.tag}</span>${subl}`;
    btn.addEventListener('click',()=>select(i));
    bar.appendChild(btn);
  });
}
function roleTag(c){const r=roles[c];return `<span class="rt" style="--rc:var(${r.var})"><span class="swatch"></span>${r.name}</span>`;}
function ownerTag(c){const r=roles[c];return `<span class="tag" style="--rc:var(${r.var})"><span class="swatch"></span>${r.name}</span>`;}

function renderCommon(common){
  const rows=Math.ceil(common.length/2);
  return `<div class="common anim"><div class="common-title">Before the submissions split</div>
    <ul class="sub-steps" style="--rows:${rows}">${common.map((st,i)=>
      `<li><span class="num">${i+1}</span><span class="body">${st.t}<span class="role-tags">${st.r.map(roleTag).join('')}</span></span></li>`).join('')}</ul></div>`;
}
function renderSubmissions(subs){
  return `<div class="subs anim">${subs.map(sub=>{
    const comp = sub.comprises ? `<div class="comprises"><div class="ctitle">Comprises</div>${sub.comprises.map(c=>
      `<div class="crow"><span class="doc">${c.doc}</span><span class="role-tags">${c.r.map(roleTag).join('')}</span></div>`).join('')}</div>` : '';
    const checks = sub.checks ? `<div class="checks-badges">${sub.checks.map(c=>`<span class="cb">${c}</span>`).join('')}</div>` : '';
    const steps = `<ol class="sc-steps">${sub.steps.map((st,i)=>{
      const cls = st.xref ? ' class="xref"' : '';
      const style = st.xref ? ` style="--xc:${st.xref}"` : '';
      const xtag = st.xtag ? `<span class="xtag">⇢ ${st.xtag}</span>` : '';
      const inote = st.note ? `<div class="sub-note" style="margin-top:9px${st.xref?`;--sca:${st.xref}`:''}">ⓘ ${st.note}</div>` : '';
      return `<li${cls}${style}><span class="n">${i+1}</span><span class="body">${xtag}${st.t}<span class="role-tags">${st.r.map(roleTag).join('')}</span>${inote}</span></li>`;
    }).join('')}</ol>`;
    const note = sub.note ? `<div class="sub-note">ⓘ ${sub.note}</div>` : '';
    return `<div class="sub-card" style="--sca:${sub.sca}">
      <div class="sc-head"><div class="sc-badge">${sub.name.slice(-1)}</div>
        <div><div class="sc-name">${sub.name}</div><div class="sc-only">${sub.only}</div></div></div>
      ${comp}${checks}${steps}${note}</div>`;
  }).join('')}</div>`;
}

function select(i){
  current=i;
  bar.querySelectorAll('.stage').forEach((n,idx)=>{n.classList.toggle('active',idx===i);n.classList.toggle('done',idx<i);});
  const fill=stages.length>1?(i/(stages.length-1))*88:0;
  bar.style.setProperty('--fill',fill+'%');
  const s=stages[i];
  panel.style.setProperty('--sc',s.color);
  document.documentElement.style.setProperty('--glow',s.color);

  const ownersHtml = s.owners && s.owners.length ? `<div class="owners anim">${s.owners.map(ownerTag).join('')}</div>`:'';

  let bodyHtml;
  if(s.submissions){
    bodyHtml = (s.common?renderCommon(s.common):'') + renderSubmissions(s.submissions);
  } else if(s.steps && s.steps.length){
    const rows=Math.ceil(s.steps.length/2);
    bodyHtml=`<ul class="sub-steps anim" style="--rows:${rows}">${s.steps.map((st,idx)=>
      `<li><span class="num">${idx+1}</span><span class="body">${st.t}<span class="role-tags">${st.r.map(roleTag).join('')}</span></span></li>`).join('')}</ul>`;
  } else {
    bodyHtml=`<div class="placeholder anim">Content for the <b>New Workflow</b> ${s.title} will be added next.</div>`;
  }

  const gateHtml = s.gate ? `<div class="gate anim">➜ ${s.gate}</div>`:'';
  panel.innerHTML=`
    <div class="panel-head anim"><div class="badge">${s.icon}</div>
      <div><div class="sub">${s.tag}</div><h2>${s.title}</h2></div></div>
    ${s.desc?`<p class="desc anim">${s.desc}</p>`:''}
    ${ownersHtml}${bodyHtml}${gateHtml}`;
  prevBtn.disabled=i===0;nextBtn.disabled=i===stages.length-1;
}

prevBtn.addEventListener('click',()=>current>0&&select(current-1));
nextBtn.addEventListener('click',()=>current<stages.length-1&&select(current+1));

buildBar();select(0);

const glow=document.getElementById('glow');
let gx=innerWidth/2,gy=innerHeight/2,cx=gx,cy=gy;
document.addEventListener('mousemove',e=>{gx=e.clientX;gy=e.clientY;});
document.addEventListener('mouseleave',()=>glow.style.opacity=0);
document.addEventListener('mouseenter',()=>glow.style.opacity=1);
(function loop(){cx+=(gx-cx)*0.12;cy+=(gy-cy)*0.12;glow.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;requestAnimationFrame(loop);})();
</script>
</body>
</html>
